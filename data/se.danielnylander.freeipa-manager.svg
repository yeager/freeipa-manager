  <!-- Shield inner highlight -->
  <path d="M64 16 L104 33 L104 60 C104 85 85 105 64 112 C43 105 24 85 24 60 L24 33 Z"
        fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
  <!-- Key head (circle) -->
  <circle cx="64" cy="52" r="14" fill="url(#keyGrad)" stroke="#92400e" stroke-width="1.5"/>
  <!-- Key hole -->
  <circle cx="64" cy="52" r="5" fill="#1e1b4b"/>
  <!-- Key shaft -->
  <rect x="61" y="66" width="6" height="28" rx="2" fill="url(#keyGrad)" stroke="#92400e" stroke-width="1"/>
  <!-- Key teeth -->
  <rect x="67" y="80" width="8" height="4" rx="1" fill="url(#keyGrad)" stroke="#92400e" stroke-width="0.8"/>
  <rect x="67" y="88" width="6" height="4" rx="1" fill="url(#keyGrad)" stroke="#92400e" stroke-width="0.8"/>
</svg>
